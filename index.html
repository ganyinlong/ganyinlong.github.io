<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="汽配英语">
<meta name="theme-color" content="#1154cc">
<title>汽配外贸英语 180 天</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:#f2f5fa;color:#1a202c;line-height:1.65;padding-bottom:150px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(140deg,#1154cc,#3d86ff);color:#fff;
padding:calc(16px + env(safe-area-inset-top)) 14px 16px}
.h-in{max-width:680px;margin:0 auto}
.h-row{display:flex;align-items:baseline;gap:8px}
.h-n{font-size:15px;font-weight:600;opacity:.9}
.h-d{font-size:12px;opacity:.75;margin-left:auto}
.h-t{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:.01em}
.h-p{font-size:12px;opacity:.8;margin-top:2px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(20,30,60,.07)}
.step{font-size:12px;font-weight:700;color:#1154cc;letter-spacing:.08em;margin-bottom:2px}
.step b{font-size:15px;color:#1a202c;letter-spacing:0;margin-left:6px}
.sub{font-size:12px;color:#8b95a5;margin-top:2px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;
font-weight:700;background:#1154cc;color:#fff;margin-top:12px}
.btn.ghost{background:#eef3fd;color:#1154cc}
.btn.grey{background:#f2f4f8;color:#5a6473;font-weight:600}
.btn:active{opacity:.82}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{margin-top:0;flex:1}
.wordbox{margin-top:12px;border:1px solid #e8edf6;border-radius:14px;padding:16px 14px;background:#fbfcff}
.w-idx{font-size:12px;color:#9aa4b2;text-align:right}
.w-en{font-size:34px;font-weight:800;letter-spacing:.01em;margin-top:-4px}
.w-syl{font-size:13px;color:#8b95a5;margin-left:8px;letter-spacing:.04em}
.w-cn{font-size:20px;font-weight:700;color:#1154cc;margin-top:2px}
.w-ex{font-size:15px;color:#3d4757;margin-top:12px;padding-top:12px;border-top:1px dashed #e2e8f2}
.w-ex-cn{font-size:14px;color:#7a8494;margin-top:4px}
.hidecn .w-cn,.hidecn .w-ex-cn{color:transparent;background:#e7edfa;border-radius:6px}
.nav2{display:flex;gap:8px;margin-top:12px}
.nav2 button{flex:1;border:1px solid #dfe5ee;background:#fff;border-radius:10px;padding:12px 4px;
font-size:14px;font-weight:600;color:#46505f}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#5a6473;margin-top:14px}
.switch input{width:18px;height:18px}
.out{font-size:17px;font-weight:700;line-height:1.6;margin-top:10px}
.fold{margin-top:12px;border-top:1px solid #eef1f6;padding-top:10px}
.fold summary{font-size:13px;font-weight:700;color:#6c4ebe;cursor:pointer}
.fold p{font-size:14px;color:#4a5463;margin:8px 0 0}
.fold .en{color:#2b4a86;font-weight:600}
.checkbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));
background:rgba(242,245,250,.94);padding:8px 14px;backdrop-filter:blur(6px);z-index:30}
.checkbar .inner{max-width:680px;margin:0 auto}
#checkBtn{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;
background:#12a150;color:#fff;box-shadow:0 6px 16px rgba(18,161,80,.28)}
#checkBtn.done{background:#e8f6ee;color:#12a150;box-shadow:none}
.progress{height:6px;border-radius:3px;background:#e6eaf2;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:#1154cc;width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e6eaf1;
display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:31}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:#8b95a5;font-weight:600}
nav button.on{color:#1154cc}
nav button span{display:block;font-size:20px;line-height:1.25}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #f2f5f9;font-size:14px}
.row:last-child{border-bottom:0}
.row .n{width:46px;color:#8b95a5;font-size:12px;flex:0 0 46px}
.row .t{flex:1}
.row .ok{color:#12a150;font-size:12px}
.row.cur{background:#eef3fd;border-radius:8px}
.list{max-height:66vh;overflow:auto;margin-top:6px}
.big{font-size:34px;font-weight:800;color:#1154cc;text-align:center;margin:6px 0 2px}
.mid{font-size:13px;color:#8b95a5;text-align:center}
.stat{display:flex;gap:10px;margin-top:14px}
.stat div{flex:1;background:#f7f9fd;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:#1154cc}
.stat span{font-size:11px;color:#8b95a5}
.tip{font-size:12px;color:#9aa4b2;margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<header><div class="h-in">
  <div class="h-row"><div class="h-n" id="hN">第 1 / 180 天</div><div class="h-d" id="hD"></div></div>
  <div class="h-t" id="hT"></div>
  <div class="h-p" id="hP"></div>
</div></header>

<div class="wrap">
  <div id="vToday">
    <div class="card">
      <div class="step">第一步<b>听 3 分钟</b></div>
      <div class="sub">戴耳机，跟着读出声。听懂一半就行。</div>
      <button class="btn" id="bPlay">▶ 播放全部</button>
      <div class="btn-row">
        <button class="btn grey" id="bSlow">慢速跟读</button>
        <button class="btn grey" id="bStop">停止</button>
      </div>
    </div>

    <div class="card">
      <div class="step">第二步<b>学词</b></div>
      <div class="sub" id="wSub"></div>
      <div class="wordbox">
        <div class="w-idx" id="wIdx">1 / 4</div>
        <div><span class="w-en" id="wEn"></span><span class="w-syl" id="wSyl"></span></div>
        <div class="w-cn" id="wCn"></div>
        <div class="w-ex" id="wEx"></div>
        <div class="w-ex-cn" id="wExCn"></div>
      </div>
      <div class="nav2">
        <button id="bPrev">← 上一个</button>
        <button id="bSay">读一遍</button>
        <button id="bNext">下一个 →</button>
      </div>
      <label class="switch"><input type="checkbox" id="cbHide"> 遮住中文，先自己想（自测用）</label>
    </div>

    <div class="card">
      <div class="step">第三步<b>说</b></div>
      <div class="sub">今天的任务，做完就打卡。</div>
      <div class="out" id="out"></div>
      <details class="fold">
        <summary>多学一点：发音 / 语法</summary>
        <p id="foldSound"></p>
        <p id="foldGram"></p>
        <p class="en" id="foldEx"></p>
      </details>
    </div>

    <div class="card" id="revCard" style="display:none">
      <div class="step">顺带复习<b>前几天学过的</b></div>
      <div id="rev" class="sub" style="margin-top:8px"></div>
    </div>
  </div>

  <div id="vList" style="display:none">
    <div class="card">
      <div class="step">目录<b>180 天</b></div>
      <div class="list" id="list"></div>
    </div>
  </div>

  <div id="vMe" style="display:none">
    <div class="card">
      <div class="step">我的进度</div>
      <div class="big" id="meDone">0</div>
      <div class="mid">已完成天数</div>
      <div class="progress"><i id="meBar"></i></div>
      <div class="stat">
        <div><b id="meStreak">0</b><span>连续打卡</span></div>
        <div><b id="meTotal">180</b><span>总天数</span></div>
        <div><b id="mePct">0%</b><span>完成度</span></div>
      </div>
      <div class="tip">进度存在这台手机里，换浏览器或清缓存会清零。每天做完点一次绿色按钮即可。</div>
      <button class="btn grey" id="bReset" style="margin-top:14px">清空打卡记录</button>
    </div>
  </div>
</div>

<div class="checkbar"><div class="inner">
  <button id="checkBtn">今天学完了 ✓</button>
</div></div>

<nav>
  <button id="nToday" class="on"><span>◎</span>今天</button>
  <button id="nList"><span>≡</span>目录</button>
  <button id="nMe"><span>★</span>我的</button>
</nav>

"cn":"稍等","ex":"Could you hold on a moment?","ex_cn":"请稍等一下好吗？"},{"w":"line","syl":"LINE","pos":"n.","cn":"线路","ex":"The line is not clear.","ex_cn":"线路不太清楚。"},{"w":"call back","syl":"call BACK","pos":"phr.","cn":"回电","ex":"I will call you back in ten minutes.","ex_cn":"我十分钟后回你电话。"}],"sound":"hold on 连读，d 轻读","gram":"May I speak to ... ?","gramRule":"电话找人固定说法：May I speak to + 人名","gramEx":["May I speak to the purchasing manager?","I am calling about the order."],"output":"用英文演一遍电话：找人、说明来意、约回电"},{"n":176,"date":"2027-05-10","wd":"周一","phase":"P16 复购与年度","topic":"邮件礼仪","words":[{"w":"Dear","syl":"DEAR","pos":"n.","cn":"尊敬的（称呼）","ex":"Dear Mr. Ahmed, thank you for your email.","ex_cn":"尊敬的艾哈迈德先生，感谢来信。"},{"w":"regards","syl":"re-GARDS","pos":"n.","cn":"此致（结尾）","ex":"Best regards, Long.","ex_cn":"此致，阿龙。"},{"w":"apologize","syl":"a-POL-o-gize","pos":"v.","cn":"道歉","ex":"I apologize for the late reply.","ex_cn":"抱歉回复晚了。"},{"w":"attach","syl":"at-TACH","pos":"v.","cn":"附上","ex":"Please find the file attached.","ex_cn":"文件见附件。"}],"sound":"apologize 重音在第二节 a-POL-o-gize","gram":"I apologize for + 名词/动名词","gramRule":"道歉用 apologize for + 事，别用 apologize you","gramEx":["I apologize for the mistake.","I apologize for not replying earlier."],"output":"用英文写一封标准邮件：称呼、致谢、正文、附件、结尾"},{"n":177,"date":"2027-05-11","wd":"周二","phase":"P16 复购与年度","topic":"数据表达","words":[{"w":"account for","syl":"ac-COUNT for","pos":"phr.","cn":"占（比例）","ex":"Brakes account for 45% of our sales.","ex_cn":"刹车占我们销售的 45%。"},{"w":"compared with","syl":"com-PARED with","pos":"phr.","cn":"相比","ex":"Compared with last year, volume is up 20%.","ex_cn":"和去年比，量涨了 20%。"},{"w":"average","syl":"AV-er-age","pos":"n./adj.","cn":"平均","ex":"Average order value is USD 15,000.","ex_cn":"平均订单金额 1.5 万美元。"},{"w":"forecast","syl":"FOR-e-cast","pos":"n.","cn":"预测","ex":"Our forecast for Q2 is 8,000 sets.","ex_cn":"二季度预测 8000 套。"}],"sound":"average 重音在前 AV-er-age","gram":"account for + 比例","gramRule":"说占比用 account for，别说 occupy","gramEx":["Exports account for 70%.","This item accounts for half of the volume."],"output":"用英文用三个数字描述你们生意：占多少、涨多少、平均多少"},{"n":178,"date":"2027-05-12","wd":"周三","phase":"P16 复购与年度","topic":"综合模拟","words":[{"w":"scenario","syl":"sce-NAR-i-o","pos":"n.","cn":"场景","ex":"Let us practise a difficult scenario.","ex_cn":"我们练一个难场景。"},{"w":"handle","syl":"HAN-dle","pos":"v.","cn":"处理","ex":"How would you handle this?","ex_cn":"你会怎么处理？"},{"w":"objection","syl":"ob-JEC-tion","pos":"n.","cn":"异议","ex":"Price is the most common objection.","ex_cn":"价格是最常见的异议。"},{"w":"confident","syl":"CON-fi-dent","pos":"adj.","cn":"有信心的","ex":"I feel more confident now.","ex_cn":"我现在更有信心了。"}],"sound":"scenario 重音在第二节 sce-NAR-i-o","gram":"How would you handle ... ?","gramRule":"假设处理用 would：How would you handle this?","gramEx":["How would you answer this?","What would you say?"],"output":"用英文演一个完整场景：客户压价 + 催货，你要一次处理完"},{"n":179,"date":"2027-05-13","wd":"周四","phase":"P16 复购与年度","topic":"结业准备","words":[{"w":"portfolio","syl":"port-FO-li-o","pos":"n.","cn":"作品集","ex":"Your recordings are your portfolio.","ex_cn":"你的录音就是你的作品集。"},{"w":"progress","syl":"PROG-ress","pos":"n.","cn":"进步","ex":"Look at your progress since day one.","ex_cn":"看看你从第一天到现在的进步。"},{"w":"goal","syl":"GOAL","pos":"n.","cn":"目标","ex":"What is your goal for next year?","ex_cn":"你明年的目标是什么？"},{"w":"habit","syl":"HAB-it","pos":"n.","cn":"习惯","ex":"Fifteen minutes a day is a habit now.","ex_cn":"每天十五分钟已经是习惯了。"}],"sound":"portfolio 重音在第二节 port-FO-li-o","gram":"What is your goal for + 时间","gramRule":"问目标用 What is your goal for next year / this quarter","gramEx":["What is your goal for Q2?","What is your plan for the exhibition?"],"output":"用英文说出你三个月的进步，以及下一个 90 天的目标"},{"n":180,"date":"2027-05-14","wd":"周五","phase":"P16 复购与年度","topic":"结业与下一程","words":[{"w":"complete","syl":"com-PLETE","pos":"v.","cn":"完成","ex":"You completed 180 days.","ex_cn":"你完成了 180 天。"},{"w":"keep going","syl":"keep GO-ing","pos":"phr.","cn":"继续","ex":"Keep going with five minutes a day.","ex_cn":"每天五分钟继续下去。"},{"w":"real conversation","syl":"RE-al con-ver-SA-tion","pos":"n.","cn":"真实对话","ex":"Now you can handle a real conversation.","ex_cn":"现在你能应对真实对话了。"},{"w":"next level","syl":"next LEV-el","pos":"n.","cn":"下一阶段","ex":"Negotiation is your next level.","ex_cn":"谈判是你的下一阶段。"}],"sound":"complete 重音在第二节 com-PLETE","gram":"Now you can + 动词","gramRule":"说能力用 Now you can + 动词，给自己正反馈","gramEx":["Now you can quote in English.","Now you can handle complaints."],"output":"用英文录一段 2 分钟结业自述：能做什么、还差什么、下一步学什么"}];
const START = "2026-11-16";
const TOTAL = 180;
const K_DONE = "apEng180.done";
const K_DAY = "apEng180.day";

const $ = id => document.getElementById(id);
let done = JSON.parse(localStorage.getItem(K_DONE) || "{}");

function dayN(){
  const ov = parseInt(localStorage.getItem(K_DAY) || "0", 10);
  if (ov > 0) return ov;
  const s = new Date(START + "T00:00:00");
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.min(TOTAL, Math.max(1, Math.round((t - s) / 86400000) + 1));
}
let N = dayN();
let L = DATA.find(d => d.n === N) || DATA[0];
let wi = 0;

/* ===== 语音 ===== */
let voices = [];
function loadV(){ voices = speechSynthesis.getVoices() || []; }
loadV();
speechSynthesis.onvoiceschanged = loadV;
function pick(lang){
  return voices.find(v => (v.lang||"").toLowerCase().startsWith(lang)) || null;
}
let playing = false;
function say(text, lang, rate){
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const v = pick(lang);
    if (v) u.voice = v;
    u.lang = lang === "en" ? "en-US" : "zh-CN";
    u.rate = rate || 1;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function play(items){
  stop(); playing = true;
  for (const it of items){
    if (!playing) return;
    if (it.p) { await wait(it.p); continue; }
    await say(it.t, it.v, it.r);
    if (it.a) await wait(it.a);
  }
  playing = false;
}
function stop(){ playing = false; try{ speechSynthesis.cancel(); }catch(e){} }

function fullScript(){
  const q = [{v:"zh",t:"第 "+N+" 天，"+L.topic,r:1,a:500},
             {v:"zh",t:"先听单词，每个读两遍，跟着读。",r:1,a:300}];
  L.words.forEach(w=>{
    q.push({v:"en",t:w.w,r:0.8,a:600});
    q.push({v:"en",t:w.w,r:1,a:900});
    q.push({v:"en",t:w.ex,r:0.95,a:1200});
  });
  (L.gramEx||[]).slice(0,2).forEach(e=>q.push({v:"en",t:e,r:0.9,a:900}));
  q.push({v:"zh",t:"今天的任务。"+L.output,r:1});
  return q;
}
function slowScript(){
  const q = [{v:"zh",t:"慢速跟读，每个词读完停四秒，你跟着读。",r:1,a:500}];
  L.words.forEach(w=>{
    q.push({v:"en",t:w.w,r:0.7,a:4000});
    q.push({v:"en",t:w.ex,r:0.75,a:4000});
  });
  return q;
}

/* ===== 渲染 ===== */
function render(){
  $("hN").textContent = "第 " + N + " / " + TOTAL + " 天";
  $("hD").textContent = (L.date||"") + " " + (L.wd||"");
  $("hT").textContent = L.topic || "";
  $("hP").textContent = L.phase || "";
  document.title = "D" + N + " " + (L.topic||"");

  $("wSub").textContent = "今天 " + L.words.length + " 个词，一个一个来。";
  wi = Math.min(wi, L.words.length - 1);
  showWord();

  $("out").textContent = L.output || "—";
  $("foldSound").textContent = "发音：" + (L.sound || "—");
  $("foldGram").textContent = "语法：" + (L.gram || "") + (L.gramRule ? "（" + L.gramRule + "）" : "");
  $("foldEx").innerHTML = (L.gramEx||[]).map(e=>"· "+e).join("<br>");

  const rev = [];
  [[3,2],[7,1],[30,1]].forEach(([off,take])=>{
    const d = DATA.find(x=>x.n===N-off);
    if (!d) return;
    d.words.slice(0,take).forEach(w=>{
      if (!rev.some(r=>r.w===w.w)) rev.push({w:w.w,cn:w.cn,from:N-off});
    });
  });
  if (rev.length){
    $("revCard").style.display = "";
    $("rev").innerHTML = rev.map(r=>"· <b>"+r.w+"</b> "+r.cn+"（第"+r.from+"天）").join("<br>");
  } else {
    $("revCard").style.display = "";
    $("rev").innerHTML = '<span style="color:#9aa4b2">第 4 天开始，这里会出现你 3 天前、7 天前、30 天前学过的词，帮你记住不忘。</span>';
  }
  renderCheck();
}
function showWord(){
  const w = L.words[wi];
  if (!w) return;
  $("wIdx").textContent = (wi+1) + " / " + L.words.length;
  $("wEn").textContent = w.w;
  $("wSyl").textContent = w.syl || "";
  $("wCn").textContent = w.cn;
  $("wEx").textContent = w.ex;
  $("wExCn").textContent = w.ex_cn || "";
}
function renderCheck(){
  const b = $("checkBtn");
  if (done[N]){ b.textContent = "第 " + N + " 天已打卡 · 点一下取消"; b.classList.add("done"); }
  else { b.textContent = "今天学完了 ✓"; b.classList.remove("done"); }
}
function streak(){
  let s = 0, d = todayDone() ? N : N - 1;
  while (done[d]) { s++; d--; }
  return s;
}
function todayDone(){ return !!done[N]; }

function renderList(){
  $("list").innerHTML = DATA.map(d=>{
    const ok = done[d.n];
    return '<div class="row'+(d.n===N?' cur':'')+'" data-n="'+d.n+'">'+
      '<div class="n">第 '+d.n+' 天</div><div class="t">'+d.topic+'</div>'+
      (ok?'<div class="ok">✓</div>':'')+'</div>';
  }).join("");
  $("list").querySelectorAll(".row").forEach(el=>{
    el.onclick = ()=>{
      N = +el.dataset.n; L = DATA.find(d=>d.n===N); wi = 0;
      localStorage.setItem(K_DAY, N);
      render(); goto("today"); window.scrollTo(0,0);
    };
  });
}
function renderMe(){
  const cnt = Object.keys(done).filter(k=>done[k]).length;
  $("meDone").textContent = cnt;
  $("meTotal").textContent = TOTAL;
  $("mePct").textContent = Math.round(cnt/TOTAL*100) + "%";
  $("meBar").style.width = (cnt/TOTAL*100) + "%";
  $("meStreak").textContent = streak();
}
function goto(v){
  ["Today","List","Me"].forEach(x=>{
    $("v"+x).style.display = (x.toLowerCase()===v) ? "" : "none";
    $("n"+x).classList.toggle("on", x.toLowerCase()===v);
  });
  if (v==="list") renderList();
  if (v==="me") renderMe();
}

/* ===== 事件 ===== */
$("bPlay").onclick = ()=>{ if (playing){ stop(); return; } play(fullScript()); };
$("bSlow").onclick = ()=>{ if (playing){ stop(); return; } play(slowScript()); };
$("bStop").onclick = stop;
$("bPrev").onclick = ()=>{ wi = (wi - 1 + L.words.length) % L.words.length; showWord(); };
$("bNext").onclick = ()=>{ wi = (wi + 1) % L.words.length; showWord(); };
$("bSay").onclick = ()=>{ stop(); const w = L.words[wi];
  play([{v:"en",t:w.w,r:0.8,a:500},{v:"en",t:w.w,r:1,a:400},{v:"en",t:w.ex,r:0.95}]); };
$("cbHide").onchange = e=>{
  document.querySelectorAll(".w-cn,.w-ex-cn").forEach(el=>{
    el.style.color = e.target.checked ? "transparent" : "";
    el.style.background = e.target.checked ? "#e7edfa" : "";
    el.style.borderRadius = e.target.checked ? "6px" : "";
  });
};
$("checkBtn").onclick = ()=>{
  if (done[N]) delete done[N]; else done[N] = true;
  localStorage.setItem(K_DONE, JSON.stringify(done));
  renderCheck(); renderMe();
};
$("bReset").onclick = ()=>{
  if (confirm("清空所有打卡记录？")){ done = {}; localStorage.removeItem(K_DONE); renderCheck(); renderMe(); }
};
$("nToday").onclick = ()=>{ localStorage.removeItem(K_DAY); N = dayN(); L = DATA.find(d=>d.n===N); wi = 0; render(); goto("today"); };
$("nList").onclick = ()=> goto("list");
$("nMe").onclick = ()=> goto("me");

render(); renderMe();
</script>
</body>
</html>
