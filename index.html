核全流程演练","gram":"全复习","gramRule":"","gramEx":[],"output":"按第十六节模拟一遍（录音 + 自评打分）"},{"n":88,"date":"2027-02-11","wd":"周四","phase":"P4 实战期","topic":"终期考核","words":[],"sound":"—","gram":"—","gramRule":"","gramEx":[],"output":"正式做 6 项考核（约 90 分钟，录音或找人打分）"},{"n":89,"date":"2027-02-12","wd":"周五","phase":"P4 实战期","topic":"个人话术卡","words":[],"sound":"—","gram":"—","gramRule":"","gramEx":[],"output":"从自己业务里挑 30 句做成《高频话术卡》"},{"n":90,"date":"2027-02-13","wd":"周六","phase":"P4 实战期","topic":"复盘与下一程","words":[],"sound":"—","gram":"—","gramRule":"","gramEx":[],"output":"复盘 90 天 + 定下一个 90 天计划（长期维护 20 小时 / 月）"}];
const START = "2026-11-16";
const TOTAL = 90;
const LS_OK = "apEng.done";
const LS_DAY = "apEng.override";

const $ = id => document.getElementById(id);
const done = JSON.parse(localStorage.getItem(LS_OK) || "{}");

function todayN(){
  const ov = localStorage.getItem(LS_DAY);
  if (ov) return parseInt(ov,10);
  const s = new Date(START + "T00:00:00");
  const t = new Date(); t.setHours(0,0,0,0);
  const n = Math.round((t - s) / 86400000) + 1;
  return Math.max(1, Math.min(TOTAL, n));
}
let N = todayN();
let lesson = DATA.find(d => d.n === N) || DATA[0];

/* ---------- 语音 ---------- */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices() || []; }
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

function pick(lang){
  const exact = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang));
  return exact || null;
}
let queue = [], qi = 0, playing = false, timer = null;

function say(text, lang, rate){
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const v = pick(lang);
    if (v) u.voice = v;
    u.lang = lang === "en" ? "en-US" : "zh-CN";
    u.rate = rate || 1;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function playQueue(items){
  stopAll(); playing = true; setPlayUI(true);
  for (const it of items){
    if (!playing) break;
    if (it.pause) { await wait(it.pause); continue; }
    await say(it.t, it.v, it.rate);
    if (it.after) await wait(it.after);
  }
  playing = false; setPlayUI(false);
}
function stopAll(){
  playing = false;
  speechSynthesis.cancel();
  if (timer) { clearTimeout(timer); timer = null; }
  setPlayUI(false);
}
function setPlayUI(on){
  $("btnPlay").classList.toggle("on", on);
}

function fullScript(){
  const q = [{v:"zh", t:"第 " + N + " 天。" + lesson.topic, rate:1, after:500},
             {v:"zh", t:"先听四个单词，每个读两遍，跟着读。", rate:1, after:400}];
  lesson.words.forEach(w => {
    q.push({v:"en", t:w.w, rate:0.8, after:700});
    q.push({v:"en", t:w.w, rate:1, after:1200});
    q.push({v:"en", t:w.ex, rate:0.95, after:1400});
  });
  if (lesson.sound) q.push({v:"zh", t:"发音。", rate:1, after:300}, {v:"zh", t:lesson.sound, rate:1, after:600});
  if (lesson.gramRule) q.push({v:"zh", t:"语法。", rate:1, after:300}, {v:"zh", t:lesson.gramRule, rate:1, after:500});
  (lesson.gramEx || []).forEach(e => q.push({v:"en", t:e, rate:0.9, after:1000}));
  q.push({v:"zh", t:"今天的输出。" + lesson.output, rate:1, after:600});
  return q;
}
function slowScript(){
  const q = [{v:"zh", t:"慢速跟读。每个词读一遍，然后停四秒，你跟着读出来。", rate:1, after:600}];
  lesson.words.forEach(w => {
    q.push({v:"en", t:w.w, rate:0.7, after:4000});
    q.push({v:"en", t:w.ex, rate:0.75, after:4000});
  });
  return q;
}

/* ---------- 渲染 ---------- */
function render(){
  $("hDay").textContent = "第 " + N + " 天";
  $("hDate").textContent = (lesson.date || "") + " " + (lesson.wd || "");
  $("hTopic").textContent = lesson.topic || "";
  $("hPhase").textContent = lesson.phase || "";
  document.title = "D" + N + " " + (lesson.topic || "");

  $("words").innerHTML = lesson.words.map((w,i) => `
    <div class="word" data-i="${i}">
      <div class="w-line">
        <span class="w-en">${w.w}</span>
        <span class="w-syl">${w.syl || ""}</span>
        <span class="w-pos">${w.pos || ""}</span>
        <span class="w-cn reveal" data-cn="${i}">${w.cn}</span>
      </div>
      <div class="w-ex">${w.ex}</div>
    </div>`).join("");

  document.querySelectorAll(".word").forEach(el => {
    el.addEventListener("click", () => {
      const i = +el.dataset.i, w = lesson.words[i];
      const cn = el.querySelector(".w-cn");
      const wasHidden = cn.classList.contains("reveal") && !cn.classList.contains("show");
      if (wasHidden){ cn.classList.add("show"); return; }
      stopAll();
      playQueue([{v:"en", t:w.w, rate:0.85, after:600}, {v:"en", t:w.w, rate:1, after:500},
                 {v:"en", t:w.ex, rate:0.95}]);
    });
  });

  $("snd").textContent = lesson.sound || "—";
  $("gram").textContent = (lesson.gram || "") + (lesson.gramRule ? "　" + lesson.gramRule : "");
  $("gramEx").innerHTML = (lesson.gramEx || []).map(e => "· " + e).join("<br>");
  $("output").textContent = lesson.output || "";

  document.querySelectorAll(".chip").forEach(c => {
    c.classList.toggle("done", !!(done[N] && done[N][c.dataset.k]));
  });
  const d = done[N] || {};
  const cnt = ["words","listen","gram","output"].filter(k => d[k]).length;
  $("doneHint").textContent = cnt === 4 ? "今天已完成 4/4，明天见。" : "已打卡 " + cnt + "/4（点上面四项自评）";
  $("doneHint").dataset.cnt = cnt;

  // 复习
  const rev = [];
  [[3,2],[7,1],[30,1]].forEach(([off,take]) => {
    const dd = DATA.find(x => x.n === N - off);
    if (!dd) return;
    dd.words.slice(0,take).forEach(w => { if (!rev.some(r => r.w === w.w)) rev.push({...w, from: N-off}); });
  });
  if (rev.length){
    $("revCard").style.display = "";
    $("rev").innerHTML = rev.map(r => `<div class="rev-item"><b>${r.w}</b> ${r.cn}<span class="d">D${r.from}</span></div>`).join("");
    $("rev").querySelectorAll(".rev-item").forEach((el,i) => {
      el.addEventListener("click", () => { stopAll(); playQueue([{v:"en", t:rev[i].w, rate:0.85}]); });
    });
  } else {
    $("revCard").style.display = "none";
  }
}

function renderList(){
  $("list").innerHTML = DATA.map(d => {
    const d4 = done[d.n] || {};
    const ok = ["words","listen","gram","output"].every(k => d4[k]);
    return `<div class="row" data-n="${d.n}"><div class="n">D${d.n}</div>
      <div class="t">${d.topic}</div>${ok ? '<div class="ok">✓</div>' : ""}</div>`;
  }).join("");
  $("list").querySelectorAll(".row").forEach(el => {
    el.addEventListener("click", () => {
      N = +el.dataset.n; lesson = DATA.find(d => d.n === N);
      localStorage.setItem(LS_DAY, N);
      render(); showView("today"); window.scrollTo(0,0);
    });
  });
}

/* ---------- 事件 ---------- */
$("btnPlay").onclick = () => { if (playing) { stopAll(); return; } playQueue(fullScript()); };
$("btnSlow").onclick = () => { if (playing) { stopAll(); return; } playQueue(slowScript()); };
$("btnStop").onclick = stopAll;
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    done[N] = done[N] || {};
    done[N][c.dataset.k] = !done[N][c.dataset.k];
    localStorage.setItem(LS_OK, JSON.stringify(done));
    render(); renderList();
  });
});
function showView(v){
  $("viewToday").style.display = v === "today" ? "" : "none";
  $("viewList").style.display = v === "list" ? "" : "none";
  $("navToday").classList.toggle("on", v === "today");
  $("navList").classList.toggle("on", v === "list");
  if (v === "list") renderList();
}
$("navToday").onclick = () => { localStorage.removeItem(LS_DAY); N = todayN(); lesson = DATA.find(d => d.n === N) || DATA[0]; render(); showView("today"); };
$("navList").onclick = () => showView("list");

render(); renderList();
</script>
